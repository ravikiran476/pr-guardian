name: PR Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Produce the reports PR Guardian reads. continue-on-error lets the
      # guardian report on failures instead of the job stopping here.
      - name: Test with coverage
        run: npx vitest run --coverage --coverage.reporter=json-summary
        continue-on-error: true

      - uses: ./
        with:
          fail-on: error
          ai-summary: true
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
